server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Pilets are loaded cross-origin by the shell (served from a different port),
    # so every static asset (bundle, chunks, images, styles) needs CORS headers.
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, OPTIONS";

    # Static pilet feed consumed by the shell's requestPilets().
    location = /$pilet-api/ {
        default_type application/json;
        try_files /feed.json =404;
    }

    # Serve the production (minified) pilet bundle and its assets.
    location / {
        try_files $uri =404;
    }
}
