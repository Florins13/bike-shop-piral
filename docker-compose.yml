services:
  # ──────────────────────────────────────────────
  #  Piral Shell (App Shell)
  # ──────────────────────────────────────────────
  piral-shell:
    build:
      context: .
      dockerfile: Dockerfile.shell
    container_name: piral-shell
    ports:
      - "1233:80"
    depends_on:
      - bikes-pilet
      - cart-pilet
      - orders-pilet

  # ──────────────────────────────────────────────
  #  Bikes Pilet
  # ──────────────────────────────────────────────
  bikes-pilet:
    build:
      context: .
      dockerfile: Dockerfile.pilet
      args:
        PILET_DIR: bikes
        PILET_PORT: "1234"
    container_name: bikes-pilet
    ports:
      - "1234:80"

  # ──────────────────────────────────────────────
  #  Cart Pilet
  # ──────────────────────────────────────────────
  cart-pilet:
    build:
      context: .
      dockerfile: Dockerfile.pilet
      args:
        PILET_DIR: cart
        PILET_PORT: "1235"
    container_name: cart-pilet
    ports:
      - "1235:80"

  # ──────────────────────────────────────────────
  #  Orders Pilet
  # ──────────────────────────────────────────────
  orders-pilet:
    build:
      context: .
      dockerfile: Dockerfile.pilet
      args:
        PILET_DIR: orders
        PILET_PORT: "1236"
    container_name: orders-pilet
    ports:
      - "1236:80"
